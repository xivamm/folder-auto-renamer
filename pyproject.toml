[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-auto-renamer"
version = "1.0.0"
description = "Automatically rename folders with intelligent sequential naming."
readme = "README.md"
authors = [
    { name = "xivamm" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["cli", "folder", "rename", "automation", "windows", "sequential-renaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
folder-auto-renamer = "folder_auto_renamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
